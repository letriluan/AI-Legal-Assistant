[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-legal-assistant"
version = "0.1.0"
description = "Vietnamese SME legal RAG with hybrid retrieval and inspectable article references"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "python-dotenv>=1,<2", "httpx>=0.27,<1", "numpy>=1.26,<3", "rank-bm25==0.2.2", "pyvi==0.1.1", "ollama>=0.4,<1", "tqdm>=4.66,<5"]

[project.optional-dependencies]
models = ["torch>=2.4,<3", "sentence-transformers>=3.3,<6"]
data = ["pandas>=2.2,<3", "beautifulsoup4>=4.12,<5", "requests>=2.32,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legal_assistant = ["ui/*", "configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
exclude = ["notebooks", "scripts/data_pipeline", "src/legal_assistant/pipeline_core.py"]
