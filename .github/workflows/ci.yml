name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - run: python -m pip check
      - run: ruff check .
      - run: python scripts/build_preview_db.py
      - run: pytest -q
      - run: python scripts/check_artifacts.py
      - run: docker compose config --quiet
      - run: docker build -t legal-assistant-ci .
